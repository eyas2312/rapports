<!-- app.component.html -->
<div class="p-6 font-sans">
  <!-- Header -->
  <!-- Header -->
  <button class="back-button" (click)="goBack()">← Retour à la liste</button>

  <div class="flex justify-between items-center mb-4">
    <h2 class="text-xl font-bold text-slate-800">Rapport n°{{ rapportNumber }}</h2>

    <div class="flex gap-3">
      <!-- Export JSON -->
      <button
        (click)="exportToJson()"
        class="bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-medium px-4 py-2 rounded-lg transition flex items-center gap-2"
      >
        ⬇️ Exporter JSON
      </button>
      <button
        (click)="addRapport()"
        class="bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-medium px-4 py-2 rounded-lg transition flex items-center gap-2"
      >
        ✅ Ajouter le rapport
      </button>
    </div>
  </div>
  <!-- Table -->
  <div class="table-container">
    <table>
      <!-- HEAD -->
      <thead>
        <tr>
          <th>Col_1</th>
          <th>Nom</th>
          <th>Dénomination</th>
          <th>Heure Min</th>
          <th>Min</th>
          <th>Heure Max</th>
          <th>Max</th>
          <th>MoyP</th>
          <th>Unité</th>
          <th>QF</th>
          <th>Supprimer</th>
        </tr>
      </thead>

      <!-- BODY -->
      <tbody>
        @for (row of rows; track row) {
          <tr>
            <!-- ── EDIT MODE ── -->
            <td>
              <input [(ngModel)]="row.col_1" placeholder="Col_1" />
            </td>
            <td>
              <input [(ngModel)]="row.Nom" placeholder="..." />
            </td>
            <td>
              <input [(ngModel)]="row.Denomination" placeholder="..." />
            </td>
            <td>
              <input [(ngModel)]="row.HeureMin" type="time" />
            </td>
            <td>
              <input [(ngModel)]="row.Min" type="number" placeholder="..." />
            </td>
            <td>
              <input [(ngModel)]="row.HeureMax" type="time" />
            </td>
            <td>
              <input [(ngModel)]="row.Max" type="number" placeholder="..." />
            </td>
            <td>
              <input [(ngModel)]="row.MoyP" type="number" placeholder="..." />
            </td>
            <td>
              <select [(ngModel)]="row.UnitIng">
                <option value="">--</option>
                <option>°C</option>
                <option>barg</option>
                <option>kg/h</option>
                <option>kg/s</option>
                <option>m³</option>
                <option>Nm³</option>
                <option>MW</option>
                <option>MJ/m³</option>
                <option>kcal/kWh</option>
              </select>
            </td>
            <td>
              <input [(ngModel)]="row.QF" type="number" min="0" max="100" placeholder="..." />
            </td>
            <td>
              <div class="flex gap-2 justify-center">
                <button (click)="deleteRow(row)" class="text-red-700 font-bold text-xl">X</button>
              </div>
            </td>
          </tr>
        }
      </tbody>
    </table>
    <br />
    <button
      (click)="addRow()"
      class="bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium px-4 py-2 rounded-lg transition"
    >
      + Ajouter une ligne
    </button>
  </div>
</div>
