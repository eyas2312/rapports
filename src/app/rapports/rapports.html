<div class="container">
  <header>
    <h1>📊 Visualiseur de Rapports Analogiques</h1>
    <div class="stats">
      <div class="stat-card">
        <h3>Total Rapports</h3>
        <p>{{ totalRapports }}</p>
      </div>
      <div class="stat-card">
        <h3>Lignes Totales</h3>
        <p>{{ totalLignes }}</p>
      </div>
      <div class="stat-card">
        <h3>Rapports Actifs</h3>
        <p>{{ rapportsActifs }}</p>
      </div>
    </div>
  </header>

  <div class="controls">
    <div class="search-box">
      <input 
        type="text" 
        [(ngModel)]="searchTerm" 
        (input)="onSearch()"
        placeholder="Rechercher un rapport...">
      <span class="search-icon">🔍</span>
    </div>
    
    <select [(ngModel)]="sortBy" (change)="onSortChange()">
      <option value="nom">Trier par Nom</option>
      <option value="lignes">Trier par Nombre de Lignes</option>
    </select>
    
    <select [(ngModel)]="sortOrder" (change)="onSortChange()">
      <option value="asc">Croissant</option>
      <option value="desc">Décroissant</option>
    </select>
  </div>

  <div class="rapport-grid">
    <div 
      *ngFor="let rapport of filteredRapports" 
      class="rapport-card"
      (click)="openRapport(rapport)">
      <h3>{{ rapport.nom }}</h3>
      <div class="rapport-info">
        <div class="info-row">
          <span class="info-label">📄 Fichier:</span>
          <span>{{ rapport.fichier }}</span>
        </div>
        <div class="info-row">
          <span class="info-label">📊 Lignes:</span>
          <span class="badge">{{ rapport.nombre_lignes }}</span>
        </div>
      </div>
    </div>
  </div>

  <div *ngIf="filteredRapports.length === 0" class="no-results">
    Aucun rapport trouvé
  </div>
</div>
